name: Publish npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.12.1 --registry=https://registry.npmjs.org
      - name: Verify approved release revision
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF" = "refs/tags/release-v$VERSION"
          # actions/checkout rewrites the local tag ref to the commit, so fetching
          # with --tags would try to replace it with the annotated tag object and
          # fail with "would clobber existing tag". Fetch main without tags; the
          # tag-to-commit check below still uses the ref checkout resolved.
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse "refs/tags/release-v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
      - run: npm ci --ignore-scripts
      - run: npm run build:client
      - run: git diff --exit-code
      - run: npm run check
      - run: npm test
      - run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-package
          path: dist/*.tgz
      - name: Publish checked package
        run: npm publish ./dist/dsh-chrome-use-*.tgz --access public --registry=https://registry.npmjs.org
