name: Publish Chrome Web Store build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF" = "refs/tags/release-v$VERSION"
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse "refs/tags/release-v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_APP_ID: ${{ secrets.CWS_APP_ID }}
        run: node scripts/publish-store.mjs
